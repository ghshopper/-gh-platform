name: GHAdmin
options:
  bundleIdPrefix: app.ghshopper
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: ar
targets:
  GHAdmin:
    type: application
    platform: iOS
    sources:
      - path: GHAdmin
        excludes:
          - "Resources/Fonts/OFL.txt"
      # widget faces, Live Activity attributes and the shared keychain (also in GHAdminWidgets)
      - path: Shared
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - target: GHAdminWidgets
        embed: true
    entitlements:
      path: GHAdmin/GHAdmin.entitlements
      properties:
        aps-environment: production
        # the app's own group first (stays the default for its existing keychain items),
        # then the group shared with the widget extension (no portal capability needed)
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.ghshopper.com
          - $(AppIdentifierPrefix)app.ghshopper.shared
    info:
      path: GHAdmin/Info.plist
      properties:
        CFBundleDisplayName: GH Shopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        ITSAppUsesNonExemptEncryption: false
        UIDesignRequiresCompatibility: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIBackgroundModes: [remote-notification]
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - CormorantGaramond.ttf
        NSCameraUsageDescription: لتصوير القطع وإيصالات الشراء ومسح باركود البوليصة
        NSPhotoLibraryUsageDescription: لاختيار صور القطع وإيصالات الشراء
        NSPhotoLibraryAddUsageDescription: لحفظ صور الستوري
        NSFaceIDUsageDescription: لقفل التطبيق بالـ Face ID
        FirebaseAppDelegateProxyEnabled: true
        LSApplicationQueriesSchemes: [whatsapp, instagram-stories, comgooglemaps, waze]
        CFBundleURLTypes:
          - CFBundleURLName: app.ghshopper.com
            CFBundleURLSchemes: [ghadmin]
        NSSupportsLiveActivities: true
        GHKeychainGroup: $(AppIdentifierPrefix)app.ghshopper.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ghshopper.com
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual

  # Home screen / lock screen widgets and the Live Activities (WidgetKit + ActivityKit).
  GHAdminWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GHAdminWidgets
      - path: Shared
      - path: GHAdmin/Resources/Fonts/IBMPlexSansArabic-Regular.ttf
        buildPhase: resources
      - path: GHAdmin/Resources/Fonts/IBMPlexSansArabic-Medium.ttf
        buildPhase: resources
      - path: GHAdmin/Resources/Fonts/IBMPlexSansArabic-SemiBold.ttf
        buildPhase: resources
      - path: GHAdmin/Resources/Fonts/IBMPlexSansArabic-Bold.ttf
        buildPhase: resources
      - path: GHAdmin/Resources/Images/story_cheetah.png
        buildPhase: resources
      - path: GHAdmin/Resources/Images/story_cheetah_light.png
        buildPhase: resources
    entitlements:
      path: GHAdminWidgets/GHAdminWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.ghshopper.shared
    info:
      path: GHAdminWidgets/Info.plist
      properties:
        CFBundleDisplayName: GH Shopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        GHKeychainGroup: $(AppIdentifierPrefix)app.ghshopper.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ghshopper.com.widgets
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
