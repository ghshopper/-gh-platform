name: GHAdmin
options:
  bundleIdPrefix: app.ghshopper
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: ar
targets:
  GHAdmin:
    type: application
    platform: iOS
    sources:
      - path: GHAdmin
        excludes:
          - "Resources/Fonts/OFL.txt"
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: GHAdmin/GHAdmin.entitlements
      properties:
        aps-environment: production
    info:
      path: GHAdmin/Info.plist
      properties:
        CFBundleDisplayName: GH Shopper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        ITSAppUsesNonExemptEncryption: false
        UIDesignRequiresCompatibility: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - CormorantGaramond.ttf
        NSCameraUsageDescription: لتصوير القطع وإيصالات الشراء ومسح باركود البوليصة
        NSPhotoLibraryUsageDescription: لاختيار صور القطع وإيصالات الشراء
        NSPhotoLibraryAddUsageDescription: لحفظ صور الستوري
        NSFaceIDUsageDescription: لقفل التطبيق بالـ Face ID
        FirebaseAppDelegateProxyEnabled: true
        LSApplicationQueriesSchemes: [whatsapp, instagram-stories]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ghshopper.com
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
