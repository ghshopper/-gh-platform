<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>تتبّع الطلب · GH Shopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --burgundy: #5A0F1C; --gold: #B08A45; --bg: #F2F2F7; --card: #fff;
    --label: #1C1C1E; --muted: #6D6D72; --line: #E5E5EA; --green: #1F8A4C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font-family: -apple-system, "SF Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 20px; }
  header img { height: 84px; }
  h1 { font-size: 26px; margin: 14px 0 4px; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border-radius: 16px; padding: 4px 0; margin-top: 16px; }
  .item { padding: 16px 18px; border-bottom: .5px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .brand { font-size: 12px; font-weight: 600; letter-spacing: .8px; color: var(--gold); text-transform: uppercase; }
  .name { font-size: 17px; font-weight: 600; margin: 2px 0 12px; }
  .steps { display: flex; align-items: flex-start; gap: 0; }
  .step { flex: 1; text-align: center; position: relative; font-size: 12px; color: var(--muted); }
  .step .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); margin: 0 auto 6px; position: relative; z-index: 1; }
  .step::before { content: ""; position: absolute; top: 6px; right: 50%; width: 100%; height: 2px; background: var(--line); }
  .step:first-child::before { display: none; }
  .step.done .dot, .step.done::before { background: var(--burgundy); }
  .step.done { color: var(--label); font-weight: 600; }
  .state { text-align: center; padding: 48px 16px; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="GH Shopper">
    <h1 id="title">تتبّع الطلب</h1>
    <div class="sub" id="meta"></div>
  </header>
  <section id="content"><div class="state">جاري التحميل…</div></section>
  <footer id="foot">GH Shopper</footer>
</main>
<script>
  const SUPABASE_URL = "https://pjrkwzmyhjmsukdcygik.supabase.co";
  const KEY = "sb_publishable_SKNNfswdPLbwj0BymUf-yQ_UVwnzANY";
  const STEPS = [
    ["requested", "تم الطلب"],
    ["purchased", "تم الشراء"],
    ["arrived", "وصل مسقط"],
    ["delivered", "تم التسليم"],
  ];
  const content = document.getElementById("content");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = (n, l) => String(n).padStart(l, "0");

  function render(d) {
    const created = d.created_at ? new Date(d.created_at) : new Date();
    const inv = `GH-${pad(created.getMonth() + 1, 2)}-${pad(created.getDate(), 2)}-${pad(d.order_no, 3)}`;
    document.getElementById("title").textContent = d.customer ? `هلا ${d.customer} 🤍` : "تتبّع الطلب";
    document.getElementById("meta").textContent = `طلب رقم ${inv}`;
    if (d.company) document.getElementById("foot").textContent = d.company;
    const items = d.items || [];
    if (!items.length) { content.innerHTML = '<div class="state">ما في قطع في هذا الطلب.</div>'; return; }
    content.innerHTML = '<div class="card">' + items.map((it) => {
      const idx = STEPS.findIndex((s) => s[0] === it.status);
      const steps = STEPS.map((s, k) => `<div class="step ${k <= idx ? "done" : ""}"><div class="dot"></div>${s[1]}</div>`).join("");
      return `<div class="item">${it.brand ? `<div class="brand">${esc(it.brand)}</div>` : ""}<div class="name">${esc(it.name)}</div><div class="steps">${steps}</div></div>`;
    }).join("") + "</div>";
  }

  async function load() {
    const token = new URLSearchParams(location.search).get("t");
    if (!token) { content.innerHTML = '<div class="state">الرابط ناقص.</div>'; return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/gh_track`, {
        method: "POST",
        headers: { "apikey": KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_token: token }),
      });
      const data = await res.json();
      if (!res.ok || !data) throw new Error("not found");
      render(data);
    } catch (e) {
      content.innerHTML = '<div class="state">ما لقينا الطلب. تأكد من الرابط.</div>';
    }
  }
  load();
</script>
</body>
</html>
