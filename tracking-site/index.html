<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#350304">
<title>تتبّع الطلب · GH Shopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #350304; --maroon-2: #5a0a12; --gold: #CEAE6E; --gold-soft: #EADCBA;
    --cream: #F7F1E8; --card: #FFFFFF; --ink: #22110F; --muted: #85736C;
    --line: #EDE3D6; --green: #1FA35B; --wa: #25D366; --amber: #E08A00; --blue: #2F7CF6;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: "IBM Plex Sans Arabic", -apple-system, "SF Arabic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Hero ── */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(120% 90% at 85% 0%, #6b0f19 0%, var(--maroon) 55%, #220102 100%);
    padding: calc(28px + env(safe-area-inset-top)) 20px 92px;
    text-align: center;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: url("cheetah.png") no-repeat; background-size: 340px auto;
    background-position: -120px 88%; opacity: .07;
  }
  .logo { height: 92px; position: relative; z-index: 1; }
  .hello { font-size: 25px; font-weight: 700; margin: 18px 0 6px; position: relative; z-index: 1; }
  .inv {
    display: inline-block; position: relative; z-index: 1;
    font-family: "Cormorant Garamond", serif; font-size: 18px; font-weight: 600; letter-spacing: 1.5px;
    color: var(--gold); border: 1px solid rgba(206,174,110,.45); border-radius: 999px; padding: 3px 14px 2px;
    direction: ltr;
  }

  main { max-width: 540px; margin: -64px auto 0; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); position: relative; z-index: 2; }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: 0 1px 0 rgba(53,3,4,.04), 0 12px 32px -18px rgba(53,3,4,.35);
    margin-bottom: 14px;
  }

  /* ── Status card ── */
  .status-emoji { font-size: 34px; line-height: 1; }
  .status-title { font-size: 21px; font-weight: 700; margin: 10px 0 4px; }
  .status-sub { color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .track { display: flex; margin: 22px 0 4px; }
  .node { flex: 1; text-align: center; position: relative; font-size: 11.5px; color: var(--muted); }
  .node .dot {
    width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 7px; position: relative; z-index: 1;
    display: grid; place-items: center; background: #F2EADF; color: #C6B6A6; font-size: 14px;
    transition: transform .3s;
  }
  .node::before {
    content: ""; position: absolute; top: 14px; left: 50%; width: 100%; height: 3px;
    background: #F2EADF; border-radius: 3px;
  }
  .node:first-child::before { display: none; }
  .node.done .dot { background: var(--maroon); color: var(--gold); }
  .node.done::before { background: linear-gradient(to left, var(--maroon), var(--maroon-2)); }
  .node.done { color: var(--ink); font-weight: 600; }
  .node.now .dot { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(206,174,110,.28); }

  /* ── Driver ── */
  .driver { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: linear-gradient(160deg, #3d8bff, var(--blue)); color: #fff;
    display: grid; place-items: center; font-size: 24px;
  }
  .driver .who { flex: 1; min-width: 0; }
  .driver .label { font-size: 12.5px; color: var(--muted); }
  .driver .name { font-size: 18px; font-weight: 700; }
  .driver .num { font-size: 14px; color: var(--muted); direction: ltr; text-align: right; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 50px; border-radius: 15px; font-size: 16px; font-weight: 600;
    -webkit-tap-highlight-color: transparent; transition: transform .12s, filter .12s;
  }
  .btn:active { transform: scale(.97); filter: brightness(.95); }
  .btn svg { width: 21px; height: 21px; }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-call { background: #EEF4FF; color: var(--blue); }
  .btn-ig { background: #FBF3E6; color: #8A5A12; }

  /* ── Items ── */
  .section-title { font-size: 13px; color: var(--muted); font-weight: 600; margin: 22px 6px 8px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:first-child { padding-top: 2px; }
  .item:last-child { border-bottom: 0; padding-bottom: 2px; }
  .bag {
    width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: linear-gradient(160deg, #4a0710, var(--maroon)); color: var(--gold);
  }
  .bag svg { width: 22px; height: 22px; }
  .item .info { flex: 1; min-width: 0; }
  .brand { font-family: "Cormorant Garamond", serif; font-size: 15px; font-weight: 600; letter-spacing: 1.2px; color: #A8833F; text-transform: uppercase; }
  .iname { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }

  /* ── Contact ── */
  .contact-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .contact-sub { color: var(--muted); font-size: 14px; }

  .fab {
    position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 508px; margin: 0 auto; z-index: 10;
    box-shadow: 0 14px 30px -10px rgba(37,211,102,.55);
  }

  .state { text-align: center; padding: 40px 10px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--maroon); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; line-height: 1.8; }
  footer b { color: var(--maroon); font-weight: 600; }
  .fade { animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="hero">
  <img class="logo" src="logo.png" alt="GH Shopper">
  <div class="hello" id="hello">تتبّع طلبك</div>
  <div class="inv" id="inv" hidden></div>
</div>

<main id="main">
  <div class="card"><div class="state"><div class="spinner"></div>جاري تحميل طلبك…</div></div>
</main>

<script>
  const SUPABASE_URL = "https://pjrkwzmyhjmsukdcygik.supabase.co";
  const KEY = "sb_publishable_SKNNfswdPLbwj0BymUf-yQ_UVwnzANY";
  const DEFAULT_PHONE = "96877246972";

  const ICON = {
    wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1a8.2 8.2 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.8.8.6-.1 1.8-.7 2.1-1.5s.3-1.4.2-1.5-.3-.2-.6-.3zM12 21.8a9.9 9.9 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.2 23.8l6-1.6A11.8 11.8 0 0 0 23.8 12a11.7 11.7 0 0 0-3.4-8.4z"/></svg>',
    call: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.2 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.6a1 1 0 0 1-.3 1z"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  };

  // Overall journey shown in the hero card
  const NODES = [
    ["✓", "تم الطلب"],
    ["🛍", "تم الشراء"],
    ["✈", "وصل مسقط"],
    ["🚗", "مع المندوب"],
    ["★", "تم التسليم"],
  ];
  const ITEM = {
    requested: ["قيد الشراء", "#F3EEF9", "#7B4FC8"],
    purchased: ["تم الشراء", "#FFF4E0", "#B76E00"],
    arrived:   ["وصل مسقط", "#E7F7EE", "#16804A"],
    delivered: ["تم التسليم", "#F5E9EA", "#350304"],
  };
  const RANK = { requested: 0, purchased: 1, arrived: 2, delivered: 4 };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = (n, l) => String(n).padStart(l, "0");
  const digits = (p) => { let d = String(p || "").replace(/\D/g, ""); if (d.length === 8) d = "968" + d; return d; };
  const local = (p) => { const d = digits(p); return d.startsWith("968") && d.length === 11 ? d.slice(3).replace(/(\d{4})(\d{4})/, "$1 $2") : d; };

  function stage(d) {
    const items = d.items || [];
    if (d.driver_status === "delivered") return 4;
    if (items.length && items.every((i) => i.status === "delivered")) return 4;
    if (d.driver_status === "picked" || d.driver_status === "assigned") return 3;
    if (!items.length) return 0;
    return Math.min(...items.map((i) => RANK[i.status] ?? 0));
  }

  const HEAD = [
    ["📝", "استلمنا طلبك", "طلبك مسجّل عندنا وبنبدأ نشتريه من البوتيك قريب."],
    ["🛍️", "اشترينا طلبك", "قطعك صارت معنا، وفي الطريق لمسقط."],
    ["✨", "وصل طلبك مسقط", "قطعك وصلت، ونجهّزها للتوصيل لك."],
    ["🚗", "طلبك في الطريق إليك", "المندوب بيتواصل معك قبل لا يوصل."],
    ["🤍", "تم تسليم طلبك", "نتمنى تعجبك القطع! شكراً لثقتك فينا."],
  ];

  function render(d) {
    const created = d.created_at ? new Date(d.created_at) : new Date();
    const inv = `GH-${pad(created.getMonth() + 1, 2)}-${pad(created.getDate(), 2)}-${pad(d.order_no, 3)}`;
    const company = d.company || "GH Shopper";
    const phone = digits(d.phone) || DEFAULT_PHONE;
    const ig = String(d.instagram || "").replace(/^@/, "").trim();
    const st = stage(d);
    let [emoji, title, sub] = HEAD[st];
    if (st === 3 && d.driver_status === "assigned") {
      title = "طلبك جاهز للتوصيل";
      sub = "سلّمناه للمندوب، وبيطلع لك قريب.";
    }

    $("hello").textContent = d.customer ? `هلا ${d.customer} 🤍` : "تتبّع طلبك";
    $("inv").textContent = inv;
    $("inv").hidden = false;
    document.title = `${inv} · ${company}`;

    const waMsg = encodeURIComponent(`مرحبا ${company}، أستفسر عن طلبي ${inv}`);
    const nodes = NODES.map((n, k) =>
      `<div class="node ${k <= st ? "done" : ""} ${k === st ? "now" : ""}"><div class="dot">${n[0]}</div>${n[1]}</div>`
    ).join("");

    let html = `
      <div class="card fade">
        <div class="status-emoji">${emoji}</div>
        <div class="status-title">${title}</div>
        <div class="status-sub">${sub}</div>
        <div class="track">${nodes}</div>
      </div>`;

    if (d.driver && d.driver.phone) {
      const dp = digits(d.driver.phone);
      const dMsg = encodeURIComponent(`مرحبا ${d.driver.name || ""}، بخصوص توصيل طلبي ${inv}`);
      html += `
      <div class="card fade">
        <div class="driver">
          <div class="avatar">🚗</div>
          <div class="who">
            <div class="label">المندوب</div>
            <div class="name">${esc(d.driver.name || "المندوب")}</div>
            <div class="num">${esc(local(dp))}</div>
          </div>
        </div>
        <div class="btn-row">
          <a class="btn btn-call" href="tel:+${dp}">${ICON.call}اتصال</a>
          <a class="btn btn-wa" href="https://wa.me/${dp}?text=${dMsg}" target="_blank" rel="noopener">${ICON.wa}واتساب</a>
        </div>
      </div>`;
    }

    const items = d.items || [];
    html += `<div class="section-title">القطع · ${items.length}</div><div class="card fade">`;
    html += items.length ? items.map((it) => {
      const s = ITEM[it.status] || ITEM.requested;
      return `<div class="item">
        <div class="bag">${ICON.bag}</div>
        <div class="info">${it.brand ? `<div class="brand">${esc(it.brand)}</div>` : ""}<div class="iname">${esc(it.name)}</div></div>
        <span class="chip" style="background:${s[1]};color:${s[2]}">${s[0]}</span>
      </div>`;
    }).join("") : '<div class="state">ما في قطع في هذا الطلب.</div>';
    html += `</div>`;

    html += `
      <div class="card fade">
        <div class="contact-title">عندك سؤال؟</div>
        <div class="contact-sub">احنا هنا، تواصل معنا بأي وقت.</div>
        <div class="btn-row">
          <a class="btn btn-call" href="tel:+${phone}">${ICON.call}اتصال</a>
          ${ig ? `<a class="btn btn-ig" href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">${ICON.ig}انستقرام</a>` : ""}
        </div>
      </div>
      <footer><b>${esc(company)}</b><br>منتجات أصلية من البوتيكات العالمية</footer>
      <a class="btn btn-wa fab" href="https://wa.me/${phone}?text=${waMsg}" target="_blank" rel="noopener">${ICON.wa}تواصل معنا على واتساب</a>`;

    $("main").innerHTML = html;
  }

  function fail(msg) {
    $("main").innerHTML = `<div class="card"><div class="state">${msg}</div></div>
      <a class="btn btn-wa fab" href="https://wa.me/${DEFAULT_PHONE}" target="_blank" rel="noopener">${ICON.wa}تواصل معنا على واتساب</a>`;
  }

  async function load() {
    const token = new URLSearchParams(location.search).get("t");
    if (!token) return fail("الرابط ناقص. تواصل معنا ونرسل لك الرابط الصحيح.");
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/gh_track`, {
        method: "POST",
        headers: { "apikey": KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_token: token }),
      });
      const data = await res.json();
      if (!res.ok || !data || !data.order_no) throw new Error("not found");
      render(data);
    } catch (e) {
      fail("ما لقينا الطلب. تأكد من الرابط أو تواصل معنا.");
    }
  }
  load();
</script>
</body>
</html>
