name: gh_shopper
description: GH Shopper — إدارة الطلبات والعملاء والفواتير.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: any
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^7.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true

flutter:
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
