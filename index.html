<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />

    <title>GH Shopper · عالم من الفخامة</title>
    <meta name="description" content="GH Shopper — تسوّق شخصي من أرقى البوتيكات حول العالم، أصلية ١٠٠٪ مع التوصيل لكل عُمان." />

    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      try {
        var l = localStorage.getItem('gh_lang'); if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        var t = localStorage.getItem('gh_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
