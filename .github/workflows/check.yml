name: Customer app · check

on:
  push:
    branches: [customer]
    paths-ignore: ['ci/**', 'ci-out/**']

permissions:
  contents: write

concurrency:
  group: customer-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee install.log | tail -30
          node -e "require.resolve('@react-navigation/bottom-tabs')" 2>/dev/null || npx expo install @react-navigation/bottom-tabs 2>&1 | tee -a install.log | tail -10
      - name: Keep the lock file in the repo
        shell: bash
        run: |
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -qm "lock file from CI [skip ci]" && git push -q origin HEAD:customer) || true
      - name: TypeScript
        shell: bash
        run: npx tsc --noEmit 2>&1 | tee tsc.log; exit ${PIPESTATUS[0]}
      - name: Bundle (iOS + Android JavaScript)
        if: always()
        shell: bash
        run: npx expo export --platform ios --platform android --output-dir /tmp/dist 2>&1 | tail -60 | tee export.log; exit ${PIPESTATUS[0]}
      - name: Expo doctor
        if: always()
        shell: bash
        run: npx expo-doctor 2>&1 | tee doctor.log | tail -40 || true
      - name: Publish logs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          cp *.log /tmp/logs/ 2>/dev/null || true
          cp ~/Library/Logs/gym/*.log /tmp/logs/ 2>/dev/null || true
          for f in /tmp/logs/*.log; do tail -n 400 "$f" | sed -E 's/(key_content|password|PASSWORD)[^ ]*/\1 [hidden]/g' > "$f.t" && mv "$f.t" "$f"; done
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/logs/status.txt
          git clone -q --depth 1 --branch ci-logs "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" /tmp/cl
          cd /tmp/cl && rm -rf customer-check && mkdir -p customer-check && cp /tmp/logs/* customer-check/
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add customer-check && git commit -qm "customer-check ${{ github.run_number }}" && git push -q origin ci-logs
