name: Customer app · App Store screenshots

# Builds the app for the iOS Simulator and takes App Store screenshots on the
# largest iPhone and iPad (real app, live data). Runs on the customer-shots branch.
on:
  push:
    branches: [customer-shots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript packages
        run: (npm ci || npm install) 2>&1 | tail -5
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install 2>&1 | tail -10
      - name: CocoaPods
        run: cd ios && pod install 2>&1 | tail -5
      - name: Build for the Simulator
        shell: bash
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | tail -30
      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash
      - name: Take screenshots
        shell: bash
        run: |
          set -x
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          PID=$(curl -s 'https://ghshopper.com/api/customer/products?per_page=40&sort_by=created_at&sort_order=desc' | python3 -c "
          import sys,json
          d=json.load(sys.stdin); rows=d.get('data',d) if isinstance(d,dict) else d
          rows=rows.get('data',rows) if isinstance(rows,dict) else rows
          pick=[p for p in rows if p.get('images')] or rows
          print(pick[0]['id'] if pick else '')" || true)
          echo "product: $PID"
          # a piece with other colours / options, to see the new product page parts
          VID=$(python3 - <<'PY' || true
          import json, urllib.request
          B = 'https://ghshopper.com/api/customer/products'
          def get(u):
              with urllib.request.urlopen(u, timeout=20) as r: return json.load(r)
          d = get(B + '?per_page=60&sort_by=created_at&sort_order=desc')
          rows = d.get('data', d) if isinstance(d, dict) else d
          rows = rows.get('data', rows) if isinstance(rows, dict) else rows
          best = ''
          for p in rows[:60]:
              try:
                  x = get(f"{B}/{p['id']}"); x = x.get('data', x)
              except Exception: continue
              if len(x.get('variants') or []) > 1: print(p['id']); break
              if not best and (x.get('attributes') or x.get('product_attributes')): best = p['id']
          else: print(best)
          PY
          )
          [ -n "$VID" ] || VID=$PID
          echo "variant product: $VID"
          # is the new server live? (404 = old server)
          {
            for u in 'customer/products?per_page=1&gender=women' 'customer/products?per_page=1&gender=men' 'customer/settings/app' 'customer/brand-follows'; do
              echo "GET $u → $(curl -s -o /dev/null -w '%{http_code}' "https://ghshopper.com/api/$u")"
            done
            echo "POST auth/forgot-password → $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"email":"nobody@example.com"}' https://ghshopper.com/api/auth/forgot-password)"
            echo "GET gift-cards/balance → $(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' 'https://ghshopper.com/api/gift-cards/balance?code=TEST')"
          } > server.txt; cat server.txt
          xcodebuild -version | tee shots-xcode.txt
          xcrun simctl list devicetypes | tee devicetypes.txt
          mkdir -p shots
          shoot() { # device-type-pattern folder
            local TYPE=$(xcrun simctl list devicetypes | grep -E "$1" | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
            local RT=$(xcrun simctl list runtimes | grep -E '^iOS' | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
            echo "$2 → $TYPE on $RT"
            local UDID=$(xcrun simctl create "$2" "$TYPE" "$RT")
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array ar en
            xcrun simctl spawn "$UDID" defaults write -g AppleLocale ar_OM
            xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl privacy "$UDID" grant all "$BID" || true
            xcrun simctl launch "$UDID" "$BID"; sleep 25
            # first launch switches the layout to right-to-left and reloads once
            xcrun simctl terminate "$UDID" "$BID"; sleep 2
            mkdir -p "shots/$2"
            mk() { # name url
              printf -- '- openLink: %s\n- tapOn:\n    text: "Open"\n    optional: true\n- waitForAnimationToEnd:\n    timeout: 8000\n- takeScreenshot: %s\n' "$2" "$1"
            }
            DEV=$2
            {
              printf 'appId: %s\n---\n- launchApp\n- waitForAnimationToEnd:\n    timeout: 15000\n- takeScreenshot: 1-home\n' "$BID"
              mk 2-categories "ghshopper://categories"
              mk 3-product "ghshopper://product/$PID"
              printf -- '- tapOn:\n    text: ".*للسلة.*"\n    optional: true\n- waitForAnimationToEnd:\n    timeout: 4000\n'
              mk 3b-variants "ghshopper://product/$VID"
              printf -- '- scroll\n- takeScreenshot: 3c-variants-more\n'
              mk 4-search "ghshopper://search"
              mk 4b-products "ghshopper://products"
              mk 4c-forgot "ghshopper://forgot-password"
              mk 5-brands "ghshopper://brands"
              mk 6-account "ghshopper://account"
              mk 7-bag "ghshopper://bag"
            } > light.yaml
            cat light.yaml
            cp light.yaml "shots/$DEV-light.yaml"
            ~/.maestro/bin/maestro --device "$UDID" test --test-output-dir "$PWD/mo-$DEV-light" light.yaml > "shots/$DEV-maestro-light.log" 2>&1 || true
            tail -40 "shots/$DEV-maestro-light.log"
            find "mo-$DEV-light" -name "[0-9]*.png" -exec cp {} "shots/$DEV/" \; 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance dark; sleep 2
            {
              printf 'appId: %s\n---\n- launchApp\n- waitForAnimationToEnd:\n    timeout: 15000\n- takeScreenshot: 8-home-dark\n' "$BID"
              mk 9-product-dark "ghshopper://product/$PID"
            } > dark.yaml
            ~/.maestro/bin/maestro --device "$UDID" test --test-output-dir "$PWD/mo-$DEV-dark" dark.yaml > "shots/$DEV-maestro-dark.log" 2>&1 || true
            tail -20 "shots/$DEV-maestro-dark.log"
            find "mo-$DEV-dark" -name "[0-9]*.png" -exec cp {} "shots/$DEV/" \; 2>/dev/null || true
            xcrun simctl shutdown "$UDID"
          }
          shoot 'iPhone 1[0-9] Pro Max' iphone
          shoot 'iPad Pro 13' ipad
          if grep -q 'iPhone Duo' devicetypes.txt; then shoot 'iPhone Duo' duo; else echo 'no iPhone Duo simulator in this Xcode' > shots/duo-missing.txt; fi
          cp shots-xcode.txt devicetypes.txt shots/ || true
          for d in shots/*/; do for p in "$d"*.png; do [ -f "$p" ] && echo "$p $(sips -g pixelWidth -g pixelHeight "$p" | awk '/pixel/{print $2}' | tr '\n' 'x')"; done; done > shots/sizes.txt || true
          java -version 2>&1 | head -2 > shots/java.txt || true
          ls -R shots
      - name: Publish screenshots
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cp -r shots/. /tmp/out/ 2>/dev/null || true
          cp server.txt /tmp/out/ 2>/dev/null || true
          tail -n 300 build.log > /tmp/out/build.log 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/status.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan customer-shots-out
          git rm -rfq . && git clean -fdxq
          cp -r /tmp/out/. .
          git add -A && git commit -qm "shots ${{ github.sha }}" && git push -f -q origin customer-shots-out
